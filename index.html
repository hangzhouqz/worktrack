<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="简洁的工时统计记录工具，支持按项目与工种分类，离线可用。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>工时统计</title>
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title" id="viewTitle">工时统计</h1>
    <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换主题">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path class="icon-sun" d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-13a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1zm0 14a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1zM3 12a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm16 0a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-1a1 1 0 0 1-1-1zM5.6 5.6a1 1 0 0 1 1.4 0l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4zm9.6 9.6a1 1 0 0 1 1.4 0l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4zm.7-9.6a1 1 0 0 1 1.4 1.4l-.7.7a1 1 0 0 1-1.4-1.4l.7-.7zM6.3 16.3a1 1 0 0 1 1.4 0l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4z" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="view" id="viewCalendar" data-view="calendar">
    <div class="cal-nav">
      <button class="icon-btn" id="prevMonth" aria-label="上个月">‹</button>
      <div class="cal-nav__label" id="monthLabel">—</div>
      <button class="icon-btn" id="nextMonth" aria-label="下个月">›</button>
      <button class="chip-btn" id="todayBtn">今天</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="cal-hint">点击日期查看与管理当日工时 · 数字为当日合计</p>
  </main>

  <main class="view hidden" id="viewStats" data-view="stats">
    <div class="seg" id="statsRange">
      <button class="seg__btn active" data-range="week">本周</button>
      <button class="seg__btn" data-range="month">本月</button>
    </div>
    <div class="metric-row" id="statsSummary">
      <div class="metric"><span class="metric__label">总工时</span><span class="metric__value" id="statTotal">0</span></div>
      <div class="metric"><span class="metric__label">记录天数</span><span class="metric__value" id="statDays">0</span></div>
      <div class="metric"><span class="metric__label">日均</span><span class="metric__value" id="statAvg">0</span></div>
    </div>
    <section class="stats-section">
      <div class="card stats-block">
        <div class="card__row">
          <h2 class="card__title">按项目</h2>
          <span class="stats-block__hint" id="projCount"></span>
        </div>
        <div class="barlist" id="byProject"></div>
      </div>
      <div class="card stats-block">
        <div class="card__row">
          <h2 class="card__title">按工种</h2>
          <span class="stats-block__hint" id="wtCount"></span>
        </div>
        <div class="barlist" id="byWorktype"></div>
      </div>
    </section>
    <p class="cal-hint">项目与工种各自独立统计：多项目共用同一工种时，工种合计自动汇总，互不混淆。</p>
  </main>

  <main class="view hidden" id="viewSettings" data-view="settings">
    <div class="card">
      <h2 class="card__title">主题</h2>
      <div class="seg seg--full" id="themeSeg">
        <button class="seg__btn" data-theme="light">浅色</button>
        <button class="seg__btn" data-theme="dark">深色</button>
        <button class="seg__btn" data-theme="auto">跟随系统</button>
      </div>
    </div>
    <div class="card">
      <div class="card__row">
        <h2 class="card__title">项目管理</h2>
        <button class="link-btn" id="addProject">+ 新增</button>
      </div>
      <ul class="taglist" id="projectList"></ul>
    </div>
    <div class="card">
      <div class="card__row">
        <h2 class="card__title">工种管理</h2>
        <button class="link-btn" id="addWorktype">+ 新增</button>
      </div>
      <ul class="taglist" id="worktypeList"></ul>
    </div>
    <div class="card">
      <h2 class="card__title">数据</h2>
      <button class="block-btn" id="exportCsv">导出 CSV 备份</button>
      <button class="block-btn block-btn--danger" id="clearData">清空所有工时</button>
    </div>
    <p class="about">数据仅存于本机 · 不联网不上云</p>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="calendar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1zM5 9v9h14V9H5z" fill="currentColor"/></svg>
      <span>日历</span>
    </button>
    <button class="tab" data-view="stats">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 13a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-7zm6-7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V6zm6 3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V9z" fill="currentColor"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM3 12a1 1 0 0 1 1-1h1.2a6.8 6.8 0 0 1 .4-1l-.9-.9a1 1 0 0 1 0-1.4l1.4-1.4a1 1 0 0 1 1.4 0l.9.9a6.8 6.8 0 0 1 1-.4V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.2a6.8 6.8 0 0 1 1 .4l.9-.9a1 1 0 0 1 1.4 0l1.4 1.4a1 1 0 0 1 0 1.4l-.9.9a6.8 6.8 0 0 1 .4 1H21a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-1.2a6.8 6.8 0 0 1-.4 1l.9.9a1 1 0 0 1 0 1.4l-1.4 1.4a1 1 0 0 1-1.4 0l-.9-.9a6.8 6.8 0 0 1-1 .4V20a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1.2a6.8 6.8 0 0 1-1-.4l-.9.9a1 1 0 0 1-1.4 0l-1.4-1.4a1 1 0 0 1 0-1.4l.9-.9a6.8 6.8 0 0 1-.4-1H4a1 1 0 0 1-1-1v-2z" fill="currentColor"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <div class="sheet hidden" id="sheet">
    <div class="sheet__backdrop" id="logBackdrop"></div>
    <div class="sheet__panel">
      <div class="sheet__handle"></div>
      <form id="logForm" class="form" autocomplete="off">
        <input type="hidden" id="logId" />
        <div class="form__row">
          <label class="field">
            <span class="field__label">日期</span>
            <input type="date" id="logDate" required />
          </label>
        </div>
        <div class="form__row form__row--2">
          <label class="field">
            <span class="field__label">项目</span>
            <select id="logProject"></select>
          </label>
          <label class="field">
            <span class="field__label">工种</span>
            <select id="logWorktype"></select>
          </label>
        </div>
        <div class="form__row form__row--2">
          <label class="field">
            <span class="field__label">开始</span>
            <input type="time" id="logStart" />
          </label>
          <label class="field">
            <span class="field__label">结束</span>
            <input type="time" id="logEnd" />
          </label>
        </div>
        <div class="form__row">
          <label class="field">
            <span class="field__label">时长（小时）</span>
            <input type="number" id="logDuration" step="0.25" min="0" max="24" placeholder="自动计算，可手动改" />
          </label>
        </div>
        <div class="form__row">
          <label class="field">
            <span class="field__label">备注</span>
            <textarea id="logNote" rows="2" placeholder="可选"></textarea>
          </label>
        </div>
        <div class="form__actions">
          <button type="button" class="btn btn--ghost btn--danger" id="deleteLog" hidden>删除</button>
          <button type="button" class="btn btn--ghost" id="logCancel">取消</button>
          <button type="submit" class="btn btn--primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="sheet hidden" id="promptSheet">
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel">
      <div class="sheet__handle"></div>
      <form id="promptForm" class="form">
        <div class="form__row">
          <label class="field">
            <span class="field__label" id="promptLabel">名称</span>
            <input type="text" id="promptInput" required maxlength="20" />
          </label>
        </div>
        <div class="form__actions">
          <button type="button" class="btn btn--ghost" data-close>取消</button>
          <button type="submit" class="btn btn--primary">确定</button>
        </div>
      </form>
    </div>
  </div>

  <div class="sheet hidden" id="daySheet">
    <div class="sheet__backdrop" id="dayBackdrop"></div>
    <div class="sheet__panel">
      <div class="sheet__handle"></div>
      <div class="day-head">
        <div>
          <div class="day-head__date" id="dayHeadDate">—</div>
          <div class="day-head__sum" id="dayHeadSum">合计 0h</div>
        </div>
        <button class="icon-btn" id="dayClose" aria-label="关闭">✕</button>
      </div>
      <div class="day-list" id="dayLogList"></div>
      <div class="day-foot">
        <button class="btn btn--ghost day-copy" id="dayCopyBtn">复制昨日</button>
        <button class="btn btn--primary day-add" id="dayAddBtn">+ 新增工时</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
